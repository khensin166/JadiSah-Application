# Ingress: URL routing untuk staging
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staging-ingress
  namespace: staging
spec:
  ingressClassName: traefik
  rules:
  # Menggunakan nip.io agar DNS otomatis resolusi ke IP Tailscale tanpa edit hosts file!
  - host: staging.100.79.211.49.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 80
