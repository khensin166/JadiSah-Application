---
- name: Download K3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: 0755

- name: Install K3s Server
  shell: |
    INSTALL_K3S_VERSION="{{ k3s_version }}" sh /tmp/k3s-install.sh server {{ k3s_extra_args }}
  environment:
    # Memaksa IP menjadi Tailscale
    INSTALL_K3S_EXEC: "server"
  args:
    creates: /etc/rancher/k3s/k3s.yaml

- name: Pastikan service K3s berjalan
  service:
    name: k3s
    state: started
    enabled: yes

- name: Copy kubeconfig ke direktori user
  command: "cp /etc/rancher/k3s/k3s.yaml /home/{{ ansible_user }}/.kube/config"
  args:
    creates: "/home/{{ ansible_user }}/.kube/config"
  ignore_errors: yes

- name: Buat .kube directory untuk user
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Copy kubeconfig dengan aman
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
