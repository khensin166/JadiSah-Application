---
- name: Download K3s install script
  get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: 0755

- name: Extract K3s Token dari K3s Server
  slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_token_b64
  delegate_to: "{{ groups['k3s_servers'][0] }}"
  run_once: true

- name: Set k3s_token fact
  set_fact:
    k3s_token: "{{ k3s_token_b64['content'] | b64decode | trim }}"
  run_once: true

- name: Install K3s Worker
  shell: |
    INSTALL_K3S_VERSION="{{ k3s_version }}" \
    K3S_URL="{{ k3s_url }}" \
    K3S_TOKEN="{{ k3s_token }}" \
    sh /tmp/k3s-install.sh agent {{ k3s_extra_args }}
  args:
    creates: /etc/systemd/system/k3s-agent.service

- name: Pastikan service K3s agent berjalan
  service:
    name: k3s-agent
    state: started
    enabled: yes
