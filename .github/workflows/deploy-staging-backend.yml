name: "🚀 [Staging] Backend – Build & Deploy"

on:
  push:
    branches:
      - staging
      - develop
    paths:
      - 'backend/**'
      - '!backend/docs/**'        # Abaikan perubahan docs backend
      - 'k8s-infra/kubernetes/staging/backend-deployment.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: BACKEND – Lint, Test, Build, Push Image
  # ─────────────────────────────────────────────────────
  backend-staging:
    name: "Backend → Build & Push"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🐹 Setup Go"
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: "📦 Download dependensi Go"
        run: |
          cd backend
          go mod download
          go mod verify

      - name: "🧹 Lint (golangci-lint)"
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          cd backend
          golangci-lint run ./... --timeout=5m

      - name: "🧪 Unit Test"
        run: |
          cd backend
          go test -v -race -coverprofile=coverage.out ./...

      - name: "🔐 Login ke GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Buat metadata image"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jadisah-backend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=staging

      - name: "🏗️ Build & Push Docker Image Backend"
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────
  # JOB 2: DEPLOY – Apply backend ke Kubernetes staging
  # ─────────────────────────────────────────────────────
  deploy-backend-staging:
    name: "☸️ Deploy Backend ke Kubernetes (staging)"
    runs-on: ubuntu-latest
    needs: [backend-staging]
    environment: staging

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔗 Koneksi ke Tailscale VPN"
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          version: "1.80.3"

      - name: "⚙️ Setup kubectl"
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | tr -d '\n\r ' | base64 -d > kubeconfig.yml
          sed -i 's/127.0.0.1/100.79.211.49/g' kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> $GITHUB_ENV

      - name: "🚀 Apply & Rollout backend ke namespace staging"
        run: |
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          kubectl apply -f k8s-infra/kubernetes/staging/namespace.yml
          kubectl apply -f k8s-infra/kubernetes/staging/postgres-deployment.yml
          kubectl apply -f k8s-infra/kubernetes/staging/ingress.yml
          kubectl apply -f k8s-infra/kubernetes/staging/backend-deployment.yml
          kubectl set image deployment/backend backend=ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:${COMMIT_SHA} -n staging
          kubectl rollout status deployment/backend -n staging --timeout=120s
