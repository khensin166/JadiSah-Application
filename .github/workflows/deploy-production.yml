name: "🏆 Deploy Production"

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Re-tag image staging → menjadi production tag
  # TIDAK ADA BUILD ULANG! Mengambil image yang sudah teruji di staging.
  # ─────────────────────────────────────────────────────
  retag-images:
    name: "🏷️ Re-tag Staging Image → Production"
    runs-on: ubuntu-latest
    outputs:
      commit-sha: ${{ steps.get-sha.outputs.sha }}

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔐 Login ke GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "♻️ Re-tag Backend: staging → production"
        run: |
          docker pull ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:staging
          docker tag  ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:staging \
                      ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:production
          docker tag  ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:staging \
                      ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:latest
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:production
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:latest

      - name: "♻️ Re-tag Frontend: staging → production"
        run: |
          docker pull ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:staging
          docker tag  ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:staging \
                      ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:production
          docker tag  ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:staging \
                      ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:latest
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:production
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:latest

  # ─────────────────────────────────────────────────────
  # JOB 2: DEPLOY – Kirim ke Kubernetes namespace production
  # ─────────────────────────────────────────────────────
  deploy-production:
    name: "☸️ Deploy ke Kubernetes (production)"
    runs-on: ubuntu-latest
    needs: [retag-images]
    environment: production  # Bisa ditambahkan "required reviewers" di GitHub untuk approval manual

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔗 Koneksi ke Tailscale VPN"
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          version: "1.80.3"

      - name: "⚙️ Setup kubectl"
        run: |
          # Membersihkan karakter aneh/newline dan men-decode base64
          echo "${{ secrets.KUBECONFIG_DATA }}" | tr -d '\n\r ' | base64 -d > kubeconfig.yml
          # Mengubah IP 127.0.0.1 bawaan K3s menjadi IP Tailscale server Anda
          sed -i 's/127.0.0.1/100.79.211.49/g' kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> $GITHUB_ENV

      - name: "🚀 Apply manifest ke namespace production"
        run: |
          kubectl apply -f k8s-infra/kubernetes/production/ --namespace=production
          kubectl set image deployment/backend backend=ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:production -n production
          kubectl set image deployment/frontend frontend=ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:production -n production
          kubectl rollout status deployment/backend -n production --timeout=180s
          kubectl rollout status deployment/frontend -n production --timeout=180s

      - name: "🎉 Deploy berhasil!"
        run: |
          echo "Deployment ke production selesai!"
          kubectl get pods -n production
