name: "🏆 [Production] Backend – Re-tag & Deploy"

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '!backend/docs/**'        # Abaikan perubahan docs backend
      - 'k8s-infra/kubernetes/production/backend-deployment.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: Re-tag image backend staging → production tag
  # TIDAK ADA BUILD ULANG! Mengambil image yang sudah teruji di staging.
  # ─────────────────────────────────────────────────────
  retag-backend:
    name: "🏷️ Re-tag Backend: staging → production"
    runs-on: ubuntu-latest

    steps:
      - name: "🔐 Login ke GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "♻️ Re-tag Backend: staging → production"
        run: |
          docker pull ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:staging
          docker tag  ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:staging \
                      ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:production
          docker tag  ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:staging \
                      ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:latest
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:production
          docker push ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:latest

  # ─────────────────────────────────────────────────────
  # JOB 2: DEPLOY – Apply backend ke Kubernetes production
  # ─────────────────────────────────────────────────────
  deploy-backend-production:
    name: "☸️ Deploy Backend ke Kubernetes (production)"
    runs-on: ubuntu-latest
    needs: [retag-backend]
    environment: production

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔗 Koneksi ke Tailscale VPN"
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          version: "1.80.3"

      - name: "⚙️ Setup kubectl"
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | tr -d '\n\r ' | base64 -d > kubeconfig.yml
          sed -i 's/127.0.0.1/100.79.211.49/g' kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> $GITHUB_ENV

      - name: "🚀 Apply & Rollout backend ke namespace production"
        run: |
          kubectl apply -f k8s-infra/kubernetes/production/namespace.yml
          kubectl apply -f k8s-infra/kubernetes/production/ingress.yml
          kubectl apply -f k8s-infra/kubernetes/production/backend-deployment.yml
          kubectl set image deployment/backend backend=ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-backend:production -n production
          kubectl rollout status deployment/backend -n production --timeout=180s

      - name: "🎉 Deploy berhasil!"
        run: |
          echo "Backend production berhasil di-deploy!"
          kubectl get pods -n production -l app=backend
