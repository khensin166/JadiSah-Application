name: "🚀 [Staging] Frontend – Build & Deploy"

on:
  push:
    branches:
      - staging
      - develop
    paths:
      - 'frontend/**'
      - '!frontend/docs/**'       # Abaikan perubahan docs frontend
      - 'k8s-infra/kubernetes/staging/frontend-deployment.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────
  # JOB 1: FRONTEND – Lint, Build, Push Image
  # ─────────────────────────────────────────────────────
  frontend-staging:
    name: "Frontend → Build & Push"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🟢 Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install dependensi"
        run: npm ci --prefix frontend

      - name: "🧹 Lint (ESLint)"
        run: npm run lint --prefix frontend

      - name: "🔐 Login ke GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🏷️ Buat metadata image"
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/jadisah-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=staging

      - name: "🏗️ Build & Push Docker Image Frontend"
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─────────────────────────────────────────────────────
  # JOB 2: DEPLOY – Apply frontend ke Kubernetes staging
  # ─────────────────────────────────────────────────────
  deploy-frontend-staging:
    name: "☸️ Deploy Frontend ke Kubernetes (staging)"
    runs-on: ubuntu-latest
    needs: [frontend-staging]
    environment: staging

    steps:
      - name: "📥 Checkout code"
        uses: actions/checkout@v4

      - name: "🔗 Koneksi ke Tailscale VPN"
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          version: "1.80.3"

      - name: "⚙️ Setup kubectl"
        run: |
          echo "${{ secrets.KUBECONFIG_DATA }}" | tr -d '\n\r ' | base64 -d > kubeconfig.yml
          sed -i 's/127.0.0.1/100.79.211.49/g' kubeconfig.yml
          echo "KUBECONFIG=$PWD/kubeconfig.yml" >> $GITHUB_ENV

      - name: "🚀 Apply & Rollout frontend ke namespace staging"
        run: |
          COMMIT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          kubectl apply -f k8s-infra/kubernetes/staging/namespace.yml
          kubectl apply -f k8s-infra/kubernetes/staging/postgres-deployment.yml
          kubectl apply -f k8s-infra/kubernetes/staging/ingress.yml
          kubectl apply -f k8s-infra/kubernetes/staging/frontend-deployment.yml
          kubectl set image deployment/frontend frontend=ghcr.io/${{ env.IMAGE_OWNER }}/jadisah-frontend:${COMMIT_SHA} -n staging
          kubectl rollout status deployment/frontend -n staging --timeout=120s
